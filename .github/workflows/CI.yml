name: Test

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
